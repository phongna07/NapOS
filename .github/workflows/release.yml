name: Build release ISO

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vnmint-release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Require the main branch
        shell: bash
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Release builds must be dispatched from main, not $GITHUB_REF" >&2
            exit 1
          }

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read build configuration
        id: build-config
        shell: bash
        run: |
          source remix.conf
          source config/source.lock
          {
            echo "version=$VNMINT_VERSION"
            echo "artifact_base=vnmint-$VNMINT_VERSION-$VNMINT_EDITION-$VNMINT_ARCH"
            echo "base_sha256=$BASE_ISO_SHA256"
            echo "mint_fingerprint=$MINT_SIGNING_FINGERPRINT"
          } >>"$GITHUB_OUTPUT"

      - name: Run non-networked tests
        run: make test

      - name: Reclaim hosted-runner disk space
        run: tools/ci/reclaim-github-disk.sh

      - name: Install ISO build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            curl file gnupg initramfs-tools-core jq make rsync shellcheck squashfs-tools unzip xorriso
          sudo apt-get clean

      - name: Restore authenticated Mint input cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            cache/downloads/${{ steps.build-config.outputs.base_sha256 }}
            cache/gnupg
          key: >-
            vnmint-mint-ubuntu-24.04-${{ steps.build-config.outputs.base_sha256 }}-${{ steps.build-config.outputs.mint_fingerprint }}

      - name: Build and verify release ISO
        run: make release

      - name: Publish release to SourceForge
        shell: bash
        env:
          SOURCEFORGE_USERNAME: ${{ vars.SOURCEFORGE_USERNAME }}
          SOURCEFORGE_PROJECT: ${{ vars.SOURCEFORGE_PROJECT }}
          SOURCEFORGE_KNOWN_HOSTS: ${{ vars.SOURCEFORGE_KNOWN_HOSTS }}
          SOURCEFORGE_SSH_PRIVATE_KEY: ${{ secrets.SOURCEFORGE_SSH_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ steps.build-config.outputs.version }}
          ARTIFACT_BASE: ${{ steps.build-config.outputs.artifact_base }}
        run: |
          set -Eeuo pipefail

          [[ -n "$SOURCEFORGE_USERNAME" ]]
          [[ -n "$SOURCEFORGE_PROJECT" ]]
          [[ -n "$SOURCEFORGE_KNOWN_HOSTS" ]]
          [[ -n "$SOURCEFORGE_SSH_PRIVATE_KEY" ]]

          install -d -m 700 -- "$HOME/.ssh"

          key_path="$HOME/.ssh/sourceforge_actions"
          known_hosts_path="$HOME/.ssh/known_hosts"

          printf '%s\n' "$SOURCEFORGE_SSH_PRIVATE_KEY" >"$key_path"
          printf '%s\n' "$SOURCEFORGE_KNOWN_HOSTS" >"$known_hosts_path"
          chmod 600 -- "$key_path" "$known_hosts_path"

          trap 'rm -f -- "$key_path"' EXIT

          remote_host="${SOURCEFORGE_USERNAME}@frs.sourceforge.net"
          remote_dir="/home/frs/project/${SOURCEFORGE_PROJECT}/${RELEASE_VERSION}"

          printf -- '-mkdir %s\nquit\n' "$remote_dir" |
              sftp \
                  -b - \
                  -i "$key_path" \
                  -o BatchMode=yes \
                  -o IdentitiesOnly=yes \
                  -o StrictHostKeyChecking=yes \
                  -o UserKnownHostsFile="$known_hosts_path" \
                  "$remote_host"

          export RSYNC_RSH="ssh -i $key_path \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=$known_hosts_path"

          rsync \
              --archive \
              --verbose \
              --partial \
              --progress \
              -- \
              "dist/${ARTIFACT_BASE}.iso" \
              "dist/${ARTIFACT_BASE}.iso.sha256" \
              "dist/${ARTIFACT_BASE}.build-info.json" \
              "${remote_host}:${remote_dir}/"
