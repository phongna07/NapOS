<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Shield / Circle Boundary Accent (Optional floating orbit) -->
    <circle cx="250" cy="250" r="210" stroke-width="12" stroke-dasharray="800 50" opacity="0.3"/>
    
    <!-- Main Letter 'N' Frame -->
    <!-- Left Stem -->
    <path d="M 150 360 L 150 140" stroke-width="28"/>
    <circle cx="150" cy="140" r="14" fill="#FFFFFF"/>
    
    <!-- Right Stem -->
    <path d="M 350 360 L 350 140" stroke-width="28"/>
    <circle cx="350" cy="360" r="14" fill="#FFFFFF"/>

    <!-- Diagonal Crescent Connection (Merging N diagonal with Sleep Moon curve) -->
    <path d="M 150 160 C 210 210, 240 310, 350 340" stroke-width="28"/>
    <path d="M 150 160 C 230 180, 290 240, 350 340" stroke-width="14" stroke-dasharray="10 12" opacity="0.6"/>

    <!-- Nap/Sleep "Zzz" Geometric Accents -->
    <!-- Z1 (Largest, near top right stem) -->
    <path d="M 380 130 L 415 130 L 380 165 L 415 165" stroke-width="10"/>
    
    <!-- Z2 (Medium) -->
    <path d="M 405 90 L 430 90 L 405 115 L 430 115" stroke-width="8"/>
    
    <!-- Z3 (Smallest) -->
    <path d="M 425 60 L 440 60 L 425 75 L 440 75" stroke-width="6"/>
  </g>
</svg>
